<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>RIKU's iPhone</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
    }

    body {
      background-color: #0d0d0d;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* iPhone Frame */
    .iphone-frame {
      width: 100vw;
      height: 100vh;
      max-width: 414px;
      max-height: 896px;
      background-color: #000;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 50px rgba(0,0,0,0.8);
    }

    @media (min-width: 500px) {
      .iphone-frame {
        border-radius: 50px;
        height: 852px;
        border: 12px solid #262626;
      }
    }

    /* Dynamic Island */
    .dynamic-island {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 30px;
      background-color: #000;
      border-radius: 20px;
      z-index: 2000;
    }

    /* Status Bar */
    .status-bar {
      height: 48px;
      padding: 14px 24px 0 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      z-index: 1999;
    }

    .battery-pill {
      background-color: #ffd60a;
      color: #000;
      padding: 1px 4px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 800;
    }

    /* Home Screen Background (사진 17 재현) */
    #home-screen {
      flex: 1;
      background: radial-gradient(circle at 50% 30%, #20272d 0%, #08090b 85%);
      padding: 15px 22px 10px 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .app-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px 16px;
      margin-top: 30px;
    }

    .app-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .app-icon {
      width: 62px;
      height: 62px;
      border-radius: 14px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 14px rgba(0,0,0,0.4);
      transition: transform 0.15s ease;
      background-size: cover;
      background-position: center;
    }

    .app-item:active .app-icon {
      transform: scale(0.9);
    }

    .app-label {
      color: #fff;
      font-size: 11px;
      font-weight: 400;
      letter-spacing: -0.2px;
    }

    /* Search Pill Button */
    .search-pill {
      align-self: center;
      background: rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 6px 14px;
      border-radius: 20px;
      color: rgba(255, 255, 255, 0.9);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
    }

    /* Dock Bar */
    .dock {
      background: rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-radius: 35px;
      padding: 12px;
      display: flex;
      justify-content: space-around;
      margin-bottom: 5px;
    }

    /* App Overlay & Transitions */
    .app-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #f2f2f7;
      z-index: 1500;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.88);
      transition: transform 0.25s cubic-bezier(0.32, 0.72, 0, 1), opacity 0.22s ease;
    }

    .app-overlay.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    .app-header {
      background: rgba(249, 249, 249, 0.94);
      backdrop-filter: blur(10px);
      padding: 50px 16px 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 0.5px solid #c6c6c8;
      font-weight: 600;
      color: #000;
    }

    .app-body {
      flex: 1;
      overflow-y: auto;
      color: #000;
    }

    /* Home Bar */
    .home-bar {
      height: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 3000;
      background: transparent;
    }

    .home-indicator {
      width: 135px;
      height: 5px;
      background-color: #fff;
      border-radius: 3px;
      transition: background-color 0.2s;
    }

    .in-app .home-indicator {
      background-color: #000;
    }
  </style>
</head>
<body>

  <div class="iphone-frame" id="iphone-frame">
    <div class="dynamic-island"></div>

    <!-- Status Bar -->
    <div class="status-bar">
      <div style="display: flex; align-items: center; gap: 4px;">
        <span>3:36</span>
        <i class="fa-solid fa-bicycle" style="font-size: 11px;"></i>
      </div>
      <div style="display: flex; align-items: center; gap: 6px;">
        <i class="fa-solid fa-signal" style="font-size: 12px;"></i>
        <i class="fa-solid fa-wifi" style="font-size: 12px;"></i>
        <span class="battery-pill">75</span>
      </div>
    </div>

    <!-- Home Screen -->
    <div id="home-screen">
      <div class="app-grid">
        <!-- 1행 (사진 17 완전 매칭) -->
        <div class="app-item" onclick="ignoreClick()">
          <div class="app-icon" style="background: #fff; flex-direction: column; justify-content: center; align-items: center; text-align: center;">
            <span style="color: #ff3b30; font-size: 10px; font-weight: 700; margin-top: -2px;">월요일</span>
            <span style="color: #000; font-size: 24px; font-weight: 500; line-height: 1;">27</span>
          </div>
          <span class="app-label">캘린더</span>
        </div>

        <div class="app-item" onclick="openApp('photos')">
          <div class="app-icon" style="background: #fff; display: flex; justify-content: center; align-items: center;">
            <img src="https://upload.wikimedia.org/wikipedia/commons/4/46/Apple_Photos_icon.png" style="width: 100%; height: 100%; object-fit: cover;" alt="사진" />
          </div>
          <span class="app-label">사진</span>
        </div>

        <div class="app-item" onclick="ignoreClick()">
          <div class="app-icon" style="background: #e0e0e0; display: flex; justify-content: center; align-items: center;">
            <img src="https://upload.wikimedia.org/wikipedia/commons/b/b4/Apple_Camera_Icon.png" style="width: 100%; height: 100%; object-fit: cover;" alt="카메라" />
          </div>
          <span class="app-label">카메라</span>
        </div>

        <div class="app-item" onclick="ignoreClick()">
          <div class="app-icon" style="background: #000; display: flex; justify-content: center; align-items: center;">
            <img src="https://upload.wikimedia.org/wikipedia/commons/a/a2/Apple_Clock_app_icon.png" style="width: 100%; height: 100%; object-fit: cover;" alt="시계" />
          </div>
          <span class="app-label">시계</span>
        </div>

        <!-- 2행 -->
        <div class="app-item" onclick="ignoreClick()">
          <div class="app-icon" style="background: #fff;">
            <img src="https://upload.wikimedia.org/wikipedia/commons/3/30/Apple_Notes_icon.png" style="width: 100%; height: 100%; object-fit: cover;" alt="메모" />
          </div>
          <span class="app-label">메모</span>
        </div>

        <div class="app-item" onclick="ignoreClick()">
          <div class="app-icon" style="background: radial-gradient(circle at 30% 107%, #fdf497 0%, #fd5949 45%,#d6249f 60%,#285AEB 90%);">
            <i class="fa-brands fa-instagram" style="color: #fff; font-size: 38px;"></i>
          </div>
          <span class="app-label">Instagram</span>
        </div>

        <div class="app-item" onclick="ignoreClick()">
          <div class="app-icon" style="background: #fff; display: flex; justify-content: center; align-items: center;">
            <img src="https://upload.wikimedia.org/wikipedia/commons/d/d7/Google_Translate_logo.svg" style="width: 75%; height: 75%;" alt="Google 번역" />
          </div>
          <span class="app-label">Google 번역</span>
        </div>

        <div class="app-item" onclick="ignoreClick()">
          <div class="app-icon" style="background: #000; display: flex; justify-content: center; align-items: center;">
            <span style="color: #e50914; font-size: 38px; font-weight: 900; font-family: 'Helvetica Neue', Arial, sans-serif;">N</span>
          </div>
          <span class="app-label">Netflix</span>
        </div>
      </div>

      <!-- Search Pill Button -->
      <div class="search-pill">
        <i class="fa-solid fa-magnifying-glass" style="font-size: 11px;"></i>
        <span>검색</span>
      </div>

      <!-- Dock (전화, Safari, 메시지, 설정) -->
      <div class="dock">
        <div class="app-item" onclick="openApp('phone')">
          <div class="app-icon" style="background: linear-gradient(180deg, #63e683, #28a745); display: flex; justify-content: center; align-items: center;">
            <i class="fa-solid fa-phone" style="color: #fff; font-size: 28px;"></i>
          </div>
        </div>
        <div class="app-item" onclick="ignoreClick()">
          <div class="app-icon" style="background: #fff; display: flex; justify-content: center; align-items: center;">
            <img src="https://upload.wikimedia.org/wikipedia/commons/5/52/Safari_browser_logo.svg" style="width: 85%; height: 85%;" alt="Safari" />
          </div>
        </div>
        <div class="app-item" onclick="openApp('messages')">
          <div class="app-icon" style="background: linear-gradient(180deg, #63e683, #28a745); display: flex; justify-content: center; align-items: center;">
            <i class="fa-solid fa-comment" style="color: #fff; font-size: 28px;"></i>
          </div>
        </div>
        <div class="app-item" onclick="openApp('settings')">
          <div class="app-icon" style="background: linear-gradient(180deg, #a8a8a8, #6e6e6e); display: flex; justify-content: center; align-items: center;">
            <i class="fa-solid fa-gear" style="color: #fff; font-size: 32px;"></i>
          </div>
        </div>
      </div>
    </div>

    <!-- 앱 1: 전화 -->
    <div id="phone" class="app-overlay">
      <div class="app-header">
        <span style="font-size: 20px; font-weight: 800;">연락처</span>
        <i class="fa-solid fa-plus" style="color: #007aff;"></i>
      </div>
      <div class="app-body" style="padding: 15px;">
        <p style="font-weight: bold; margin-bottom: 10px; color: #8e8e93; font-size: 12px;">즐겨찾기</p>
        <div style="background: #fff; padding: 12px; border-radius: 12px; display: flex; justify-content: space-between; align-items: center;">
          <div>
            <div style="font-weight: 600;">유우시 (YUSHI) ⭐</div>
            <div style="font-size: 12px; color: #8e8e93;">得能勇志</div>
          </div>
          <i class="fa-solid fa-phone" style="color: #34c759; font-size: 18px;"></i>
        </div>
      </div>
    </div>

    <!-- 앱 2: 메시지 -->
    <div id="messages" class="app-overlay">
      <div class="app-header">
        <span style="color: #007aff; cursor: pointer; font-weight: 400;" onclick="closeApp()">‹ 뒤로</span>
        <span>유우시 (YUSHI)</span>
        <i class="fa-solid fa-video" style="color: #007aff;"></i>
      </div>
      <div class="app-body" style="padding: 15px; display: flex; flex-direction: column; gap: 8px;">
        <div style="text-align: center; font-size: 11px; color: #8e8e93; margin: 10px 0;">4월 20일 일요일</div>
        <div style="background: #e9e9eb; padding: 10px 14px; border-radius: 18px; max-width: 70%; align-self: flex-start; font-size: 15px;">료 너무 귀여운거 아니야??ㅎㅎㅎ</div>
        <div style="background: #007aff; color: #fff; padding: 10px 14px; border-radius: 18px; max-width: 70%; align-self: flex-end; font-size: 15px;">난?</div>
        <div style="background: #e9e9eb; padding: 10px 14px; border-radius: 18px; max-width: 70%; align-self: flex-start; font-size: 15px;">리쿠 카와</div>
        <div style="background: #e9e9eb; padding: 10px 14px; border-radius: 18px; max-width: 70%; align-self: flex-start; font-size: 15px;">이요</div>
      </div>
    </div>

    <!-- 앱 3: 사진 -->
    <div id="photos" class="app-overlay">
      <div class="app-header">
        <span style="font-size: 20px; font-weight: 800;">보관함</span>
        <span style="color: #007aff; font-size: 14px;">선택</span>
      </div>
      <div class="app-body">
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; padding: 2px;">
          <div style="background: #ddd; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #666;">사진 1</div>
          <div style="background: #ccc; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #666;">사진 2</div>
          <div style="background: #bbb; aspect-ratio: 1; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #666;">사진 3</div>
        </div>
      </div>
    </div>

    <!-- 앱 4: 설정 -->
    <div id="settings" class="app-overlay">
      <div class="app-header">
        <span style="font-size: 20px; font-weight: 800;">설정</span>
      </div>
      <div class="app-body" style="padding: 15px;">
        <div style="background: #fff; padding: 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px;">
          <div style="width: 48px; height: 48px; border-radius: 50%; background: #007aff; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 18px;">陸</div>
          <div>
            <div style="font-weight: 600; font-size: 16px;">마에다 리쿠 (前田陸)</div>
            <div style="font-size: 12px; color: #8e8e93;">Apple ID, iCloud+</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Home Bar -->
    <div class="home-bar" onclick="closeApp()">
      <div class="home-indicator"></div>
    </div>
  </div>

  <script>
    const frame = document.getElementById('iphone-frame');

    function openApp(appId) {
      document.querySelectorAll('.app-overlay').forEach(overlay => {
        overlay.classList.remove('active');
      });
      const targetApp = document.getElementById(appId);
      if (targetApp) {
        targetApp.classList.add('active');
        frame.classList.add('in-app');
      }
    }

    function closeApp() {
      document.querySelectorAll('.app-overlay').forEach(overlay => {
        overlay.classList.remove('active');
      });
      frame.classList.remove('in-app');
    }

    function ignoreClick() {
      // 가짜 어플은 터치 시 동작하지 않음
    }
  </script>
</body>
</html>
